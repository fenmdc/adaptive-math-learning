<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img">
<rect width="760" height="360" rx="18" fill="#fbfaf6"/>
<g font-family="Inter, Arial, sans-serif" font-weight="600">
<text x="258" y="42" font-size="20" fill="#5b6b6f">complete the square for radius</text>
<circle cx="360" cy="190" r="82" fill="#dceeed" stroke="#2f5f63" stroke-width="4"/>
<circle cx="360" cy="190" r="7" fill="#2f5f63" stroke="#2f5f63" stroke-width="2"/>
<line x1="360" y1="190" x2="442" y2="190" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
<text x="374" y="184" font-size="22" fill="#b45309">r = 2</text>
<text x="376" y="214" font-size="20" fill="#374151">center (-2, 1)</text>
<text x="120" y="316" font-size="21" fill="#374151">x^2 + 4x + y^2 - 2y = -1</text>
<text x="408" y="90" font-size="21" fill="#b45309">(x + 2)^2 + (y - 1)^2 = 4</text>
</g>
</svg>