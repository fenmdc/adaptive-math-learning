<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img">
<rect width="760" height="360" rx="18" fill="#fbfaf6"/>
<g font-family="Inter, Arial, sans-serif" font-weight="600">
<text x="270" y="42" font-size="20" fill="#5b6b6f">intercepts determine slope sign</text>
<line x1="90" y1="210" x2="670" y2="210" stroke="#9aa7a9" stroke-width="2" stroke-linecap="round"/>
<line x1="380" y1="62" x2="380" y2="318" stroke="#9aa7a9" stroke-width="2" stroke-linecap="round"/>
<line x1="220" y1="210" x2="380" y2="130" stroke="#2f5f63" stroke-width="4" stroke-linecap="round"/>
<circle cx="220" cy="210" r="8" fill="#b45309" stroke="#b45309" stroke-width="2"/>
<circle cx="380" cy="130" r="8" fill="#b45309" stroke="#b45309" stroke-width="2"/>
<text x="178" y="238" font-size="21" fill="#b45309">(a, 0)</text>
<text x="394" y="124" font-size="21" fill="#b45309">(0, b)</text>
