<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img">
<rect width="760" height="360" rx="18" fill="#fbfaf6"/>
<g font-family="Inter, Arial, sans-serif" font-weight="600">
<text x="256" y="44" font-size="22" fill="#5b6b6f">slope from two points</text>
<line x1="170" y1="260" x2="590" y2="260" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
<line x1="170" y1="280" x2="170" y2="54" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
<line x1="560" y1="80" x2="170" y2="260" stroke="#2f5f63" stroke-width="4" stroke-linecap="round"/>
<line x1="220" y1="220" x2="520" y2="220" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
<line x1="520" y1="220" x2="520" y2="100" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
<circle cx="220" cy="220" r="7" fill="#b45309"/>
<text x="192" y="204" font-size="18" fill="#374151">(0, 2)</text>
<circle cx="520" cy="100" r="7" fill="#b45309"/>
<text x="492" y="84" font-size="18" fill="#374151">(3, 8)</text>
<text x="350" y="246" font-size="20" fill="#b45309">run = 3</text>
<text x="535" y="166" font-size="20" fill="#b45309">rise = 6</text>
<text x="250" y="318" font-size="23" fill="#374151">slope = rise / run = 6 / 3 = 2</text>
</g>
</svg>